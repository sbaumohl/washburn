[project]
name = "washburn-web"
version = "0.1.0"
description = "Washburn admin dashboard and public read-only site"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "psycopg[binary,pool]>=3.2",
    "markdown-it-py>=3.0",
    "zstandard>=0.23",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
washburn-public = "washburn_web.cli:run_public"
washburn-admin = "washburn_web.cli:run_admin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["washburn_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
